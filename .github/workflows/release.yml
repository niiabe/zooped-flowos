name: Build & Release APK

# Publishes a signed release APK to GitHub Releases whenever a version tag
# (e.g. v1.8.0) is pushed. The in-app updater reads this release via the
# GitHub "releases/latest" API and installs the attached APK.
#
# Can also be run manually (Actions -> Build & Release APK -> Run workflow):
#   - Leave "publish" unchecked to only build + verify the APK for testing.
#   - Set "tag" and check "publish" to build and cut a real release.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to build/publish (e.g. v1.8.0). Defaults to pubspec version.'
        required: false
        default: ''
      publish:
        description: 'Publish a GitHub Release (otherwise build + verify only)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Determine version
        id: version
        run: |
          PUBSPEC=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME}"
          elif [ -n "${{ inputs.tag }}" ]; then
            VERSION="${{ inputs.tag }}"
          else
            VERSION="v${PUBSPEC}"
          fi
          # Ensure a leading "v" for the tag name.
          case "$VERSION" in v*) ;; *) VERSION="v${VERSION}" ;; esac
          echo "tag=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "pubspec=${PUBSPEC}" >> "$GITHUB_OUTPUT"
          echo "Resolved tag: ${VERSION} | pubspec version: ${PUBSPEC}"

      - name: Verify tag matches pubspec version
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          TAG="${TAG#v}"
          PUBSPEC="${{ steps.version.outputs.pubspec }}"
          if [ "$TAG" != "$PUBSPEC" ]; then
            echo "::error::Tag ($TAG) does not match pubspec.yaml version ($PUBSPEC). Bump pubspec before tagging."
            exit 1
          fi

      - name: Restore keystore
        run: echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Create key.properties
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.STORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code (build_runner)
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Build release APK
        run: flutter build apk --release

      - name: Rename APK
        id: apk
        run: |
          mkdir -p dist
          APK="dist/zooped-${{ steps.version.outputs.tag }}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$APK"
          echo "path=${APK}" >> "$GITHUB_OUTPUT"

      - name: Verify APK signature
        run: |
          APK="${{ steps.apk.outputs.path }}"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -Vr | head -n1)
          echo "Using: $APKSIGNER"
          # Confirm the APK is validly signed and print the signing certificate.
          "$APKSIGNER" verify --verbose --print-certs "$APK"

          # Compare the APK's signing cert against the keystore's certificate so a
          # wrong/mismatched key (which would block in-app updates) fails the build.
          APK_SHA=$("$APKSIGNER" verify --print-certs "$APK" \
            | grep -i 'SHA-256' | head -n1 | awk -F': ' '{print $2}' | tr 'A-F' 'a-f' | tr -d ' ')
          KEY_SHA=$(keytool -list -v \
            -keystore android/app/upload-keystore.jks \
            -alias "${{ secrets.KEY_ALIAS }}" \
            -storepass "${{ secrets.STORE_PASSWORD }}" \
            | grep -i 'SHA256:' | head -n1 | awk -F'SHA256: ' '{print $2}' \
            | tr 'A-F' 'a-f' | tr -d ': ')
          echo "APK cert SHA-256:      $APK_SHA"
          echo "Keystore cert SHA-256: $KEY_SHA"
          if [ -z "$APK_SHA" ] || [ "$APK_SHA" != "$KEY_SHA" ]; then
            echo "::error::APK signing certificate does not match the release keystore."
            exit 1
          fi
          echo "APK signature verified against the release keystore."

      - name: Create GitHub Release
        if: ${{ github.ref_type == 'tag' || inputs.publish }}
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.version.outputs.tag }}
          tag_name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: ${{ steps.apk.outputs.path }}

      - name: Upload APK artifact
        if: ${{ github.ref_type != 'tag' && !inputs.publish }}
        uses: actions/upload-artifact@v4
        with:
          name: zooped-apk
          path: ${{ steps.apk.outputs.path }}
